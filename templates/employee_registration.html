<!DOCTYPE html>
<html>

<head>

    <title>Employee Registration</title>

</head>

<body>

<h2>Employee Registration</h2>

<form action="/register_employee" method="POST" enctype="multipart/form-data">

    <label>Employee ID</label>

    <input
        type="text"
        name="employee_id"
        required
    >

    <br><br>

    <label>Employee Name</label>

    <input
        type="text"
        name="employee_name"
        required
    >

    <br><br>

    <label>Employee Face</label>

    <input
        type="file"
        name="employee_image"
        accept="image/*"
        required
    >

    <br><br>

    <button type="submit">

        Register Employee

    </button>

</form>

</body>

</html>
